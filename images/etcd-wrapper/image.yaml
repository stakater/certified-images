# One file per artifact (schema modelled on Iron Bank's hardening_manifest.yaml).
#
# An operand of etcd-druid (images/etcd-druid): the etcd container of the etcd pods
# that operator creates. etcd-druid's compiled-in default is Gardener's image at
# this same version; a product points it at this one per Etcd resource or
# through the operator's image override file.
kind: container
name: etcd-wrapper
displayName: Stakater build of etcd-wrapper
summary: "etcd-wrapper, the etcd server used by etcd-druid, rebuilt from source on Red Hat UBI"
description: >-
  etcd-wrapper starts an embedded etcd server configured by the etcd-backup-restore sidecar. It is the etcd container in every etcd pod that the Gardener etcd-druid operator creates. Rebuilt by Stakater from the upstream source on Red Hat Universal Base Image.

# io.openshift.tags (ADR-009): what people search the catalog for.
tags: [etcd, etcd-wrapper, etcd-druid, gardener, database]

upstream:
  repo: https://github.com/gardener/etcd-wrapper
  # renovate: datasource=github-tags depName=gardener/etcd-wrapper
  version: v0.8.4
  commit: 762fc3acabffe4bf4e362a3733b90475701d5eb1   # tag must dereference to this (ADR-003)
  license: Apache-2.0

build:
  # Hermeto prefetch input (ADR-003). Typed fetchers only.
  prefetch: '{"type": "gomod", "path": "."}'
  # Upstream commits vendor/, and Hermeto's strict check rejects it (ADR-003 §7).
  # Reported by the prefetch without this setting, 2026-11-28, added files only:
  #   vendor changed: A vendor/go.opentelemetry.io/otel/CLAUDE.md
  # Re-check on every upstream bump: a modified (M) file would mean upstream
  # edited a vendored dependency, and this setting would silently undo that.
  dropVendor: true

# Differences from upstream's image, on purpose:
#   - Built from the modules go.sum names, not from upstream's vendor/ copy.
#   - HOME is /home/nonroot, as in upstream's distroless image, and writable by
#     group 0: the backup-restore sidecar writes the etcd configuration there,
#     and under an arbitrary UID (OpenShift) HOME would otherwise be "/".
#   - The binary is at the same path as upstream's (/etcd-wrapper) with the same
#     entrypoint, because etcd-druid passes arguments only.
test:
  # Start-up test: the image must exit 0 when run with these arguments.
  command: ["start-etcd", "--help"]

# Smoke test: this image is one of two containers that only work together.
# smoke/deploy.sh runs a one-member etcd pod shaped like the one etcd-druid
# creates, with this image as the etcd container and upstream's etcd-backup-restore image,
# pinned by digest, as the backup-restore sidecar. functional/test.sh then uses it.

redhat:
  # Partner Connect container component (fill after creating the component,
  # as Red Hat-hosted: ADR-002)
  componentId: "TODO-PARTNER-CONNECT-COMPONENT-ID"

# Pushed to ghcr.io/stakater/ubi/etcd-wrapper, private by default. To make it
# public, add 'staging: {visibility: public}' in a reviewed PR (ADR-002).
consumers:
  - stakater-cloud-orchestrator   # SCO, stated by the owner 2026-11-28
