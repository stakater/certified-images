# One file per artifact (schema modelled on Iron Bank's hardening_manifest.yaml).
# Renovate bumps upstream.version + upstream.commit together; CI reads the rest.
kind: container            # container | xpkg  (ADR-005)
name: opencost
displayName: Stakater build of OpenCost
summary: OpenCost cost model rebuilt from source on Red Hat UBI
description: >-
  OpenCost cost-allocation engine for Kubernetes, rebuilt by Stakater from the
  upstream source on Red Hat Universal Base Image and certified for OpenShift.
  Used by Multi-Tenant Operator FinOps/showback.

upstream:
  repo: https://github.com/opencost/opencost
  # renovate: datasource=github-tags depName=opencost/opencost
  version: v1.121.5
  commit: 32dbf049c84c66db1efeb9fc9a98e5042f076cf1   # tag must dereference to this (ADR-003)
  license: Apache-2.0

build:
  # Hermeto prefetch input (ADR-003). Typed fetchers only.
  prefetch: '{"type": "gomod", "path": "."}'

# Deviations from upstream (ADR-002 rule 2): dependency bumps that fix a
# vulnerability in the patch SLA. Remove each one when upstream ships the fix.
deviations:
  - patch: patches/0001-bump-vulnerable-go-modules.patch
    reason: >-
      Four fixable HIGH vulnerabilities in Go modules. Not fixed in upstream
      v1.121.5 or on upstream's develop branch (checked 2026-11-25).
    fixes: [CVE-2026-116587, CVE-2026-63209, CVE-2026-78661, CVE-2026-78669]
    bumps:
      - github.com/go-jose/go-jose/v4 v4.1.4 -> v4.1.6
      - github.com/klauspost/compress v1.18.4 -> v1.18.7
      - golang.org/x/net v0.59.0 -> v0.62.0
    upstreamPR: none yet   # ADR-002 rule 2 says offer it upstream; a person does that

test:
  # Start-up test: the image must exit 0 when run with these arguments.
  command: ["--help"]

redhat:
  # Partner Connect container component (fill after creating the component)
  componentId: "TODO-PARTNER-CONNECT-COMPONENT-ID"
  # Push target: quay.io/redhat-isv-containers/<componentId>
  # Secrets: RH_PYXIS_TOKEN_OPENCOST, RH_REGISTRY_USER_OPENCOST, RH_REGISTRY_PASSWORD_OPENCOST
  secretSuffix: OPENCOST

consumers:
  - multi-tenant-operator   # CSV relatedImages + RELATED_IMAGE_OPENCOST, by digest
