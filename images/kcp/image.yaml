# One file per artifact (schema modelled on Iron Bank's hardening_manifest.yaml).
kind: container
name: kcp
displayName: Stakater build of kcp
summary: "kcp multi-tenant Kubernetes-like control plane rebuilt from source on Red Hat UBI"
description: >-
  kcp is a Kubernetes-like control plane that serves many isolated logical clusters, called workspaces, from one server. This image holds the kcp server, its front proxy, the virtual workspaces server and the cache server. Rebuilt by Stakater from the upstream source on Red Hat Universal Base Image.

# io.openshift.tags (ADR-009): what people search the catalog for.
tags: [kcp, control-plane, multi-tenancy, workspaces, kubernetes]

upstream:
  repo: https://github.com/kcp-dev/kcp
  # renovate: datasource=github-tags depName=kcp-dev/kcp
  version: v0.33.6
  commit: 977a306445341854da352c534dfaa7ea40093c20   # tag must dereference to this (ADR-003)
  license: Apache-2.0

build:
  # Hermeto prefetch input (ADR-003). Typed fetchers only. The root module
  # replaces its staging modules with ./staging/src/..., and k8s.io/* with
  # kcp's fork of Kubernetes.
  prefetch: '{"type": "gomod", "path": "."}'

# Differences from upstream's image, on purpose:
#   - No kubectl. Upstream downloads a released kubectl binary into its image;
#     we do not re-ship binaries we did not build (ADR-002 rule 2).
#   - No wget. Upstream copies it from the build image for health checks; use
#     an httpGet probe instead.
#   - No kubectl plugins (kubectl-kcp, kubectl-ws, kubectl-create-workspace):
#     they are client tools, useless without kubectl.
#   - The build date is not compiled in, so the same source gives the same binary.
#   - The four server binaries are at the same paths as upstream's (/kcp,
#     /kcp-front-proxy, /virtual-workspaces, /cache-server), with the same
#     entrypoint and default command, so charts written for upstream's image
#     keep working.
test:
  # Start-up test: the image must exit 0 when run with these arguments.
  command: ["--version"]

# Smoke test: kcp serves HTTPS only and needs a writable data directory, which
# the generic smoke pod has neither of. smoke/deploy.sh runs it as one pod
# under restricted pod security with an emptyDir for its data, and waits for
# /readyz. functional/test.sh then creates a workspace and uses it.

redhat:
  # Partner Connect container component (fill after creating the component,
  # as Red Hat-hosted: ADR-002)
  componentId: "TODO-PARTNER-CONNECT-COMPONENT-ID"

# Pushed to ghcr.io/stakater/ubi/kcp, private by default. To make it public,
# add 'staging: {visibility: public}' in a reviewed PR (ADR-002).
consumers:
  - TODO-CONFIRM-PRODUCT   # ⚠️ not stated when the image was requested; admission (d) needs the product that deploys it
