# One file per artifact (schema modelled on Iron Bank's hardening_manifest.yaml).
#
# An operand of etcd-druid (images/etcd-druid): the backup-restore sidecar of the etcd pods
# that operator creates. etcd-druid's compiled-in default is Gardener's image at
# this same version; a product points it at this one per Etcd resource or
# through the operator's image override file.
kind: container
name: etcd-backup-restore
displayName: Stakater build of etcd-backup-restore
summary: "etcd-backup-restore (etcdbrctl), the etcd sidecar used by etcd-druid, rebuilt from source on Red Hat UBI"
description: >-
  etcd-backup-restore (etcdbrctl) is the sidecar in every etcd pod that the Gardener etcd-druid operator creates. It validates and initialises the etcd data directory, serves the etcd configuration, takes full and delta snapshots, restores from them and defragments. Rebuilt by Stakater from the upstream source on Red Hat Universal Base Image.
# io.openshift.tags (ADR-009): what people search the catalog for.
tags: [etcd, etcdbrctl, backup, etcd-druid, gardener]
upstream:
  repo: https://github.com/gardener/etcd-backup-restore
  # renovate: datasource=github-tags depName=gardener/etcd-backup-restore
  version: v0.45.3
  commit: c62e81a3c420046f169d258698a86cbee48e632a # tag must dereference to this (ADR-003)
  license: Apache-2.0
build:
  # Hermeto prefetch input (ADR-003). Typed fetchers only.
  prefetch: '{"type": "gomod", "path": "."}'
  # Upstream commits vendor/, and Hermeto's strict check rejects it (ADR-003 §7).
  # Reported by the prefetch without this setting, 2026-11-28, added files only:
  #   vendor changed: A vendor/github.com/santhosh-tekuri/jsonschema/v6/.swp and A vendor/go.opentelemetry.io/otel/CLAUDE.md
  # Re-check on every upstream bump: a modified (M) file would mean upstream
  # edited a vendored dependency, and this setting would silently undo that.
  dropVendor: true
# Differences from upstream's image, on purpose:
#   - Built from the modules go.sum names, not from upstream's vendor/ copy.
#   - HOME is /home/nonroot, as in upstream's distroless image. The
#     backup-restore sidecar writes the etcd configuration there. It is owned
#     by UID 65532, which etcd-druid runs its etcd pods as, and writable by
#     group 0, for an arbitrary UID (OpenShift), whose HOME would otherwise
#     be "/".
#   - The binary is at the same path as upstream's (/etcdbrctl) with the same
#     entrypoint, because etcd-druid passes arguments only.
test:
  # Start-up test: the image must exit 0 when run with these arguments.
  command: ["--version"]
# Smoke test: this image is one of two containers that only work together.
# smoke/deploy.sh runs a one-member etcd pod shaped like the one etcd-druid
# creates, with this image as the backup-restore sidecar and upstream's etcd-wrapper image,
# pinned by digest, as the etcd container. functional/test.sh then uses it.
redhat:
  # Partner Connect container component (fill after creating the component,
  # as Red Hat-hosted: ADR-002)
  componentId: "TODO-PARTNER-CONNECT-COMPONENT-ID"
# Visibility on GHCR (ADR-002). Public on purpose, decided by the owner on
# 2026-11-28: a rebuild of Apache-2.0 software on UBI.
staging:
  visibility: public

consumers:
  - stakater-cloud-orchestrator # SCO, stated by the owner 2026-11-28
deviations:
  - patch: patches/0001-bump-vulnerable-go-modules.patch
    reason: Fixable CRITICAL or HIGH vulnerabilities in Go modules, not yet fixed in the pinned upstream release. Generated by scripts/auto-fix.sh on 2026-11-28; drop when an upstream release carries the fixes.
    fixes:
      - CVE-2026-116587
      - CVE-2026-78661
      - CVE-2026-78669
    bumps:
      - github.com/go-jose/go-jose/v4 v4.1.4 -> v4.1.6
      - golang.org/x/net v0.58.0 -> v0.62.0
    upstreamPR: none yet
