# One file per artifact (schema modelled on Iron Bank's hardening_manifest.yaml).
#
# This is the etcd-druid operator only. The etcd pods it creates run three
# other images, which are NOT built here yet: etcd-wrapper, etcd-backup-restore
# (etcdbrctl) and an alpine init image, all from Gardener's registry
# (upstream's internal/images/images.yaml, compiled into the binary). An Etcd
# resource can override the first two; see the roadmap.
kind: container
name: etcd-druid
displayName: Stakater build of etcd-druid
summary: "etcd-druid operator rebuilt from source on Red Hat UBI"
description: >-
  etcd-druid is a Kubernetes operator from the Gardener project that deploys and operates etcd clusters, including backup, restore and compaction. Rebuilt by Stakater from the upstream source on Red Hat Universal Base Image.

# io.openshift.tags (ADR-009): what people search the catalog for.
tags: [etcd, etcd-druid, operator, gardener, database]

upstream:
  repo: https://github.com/gardener/etcd-druid
  # renovate: datasource=github-tags depName=gardener/etcd-druid
  version: v0.39.2
  commit: c57142e905586656803270ff8e641cd6d3ab51d9   # tag must dereference to this (ADR-003)
  license: Apache-2.0

build:
  # Hermeto prefetch input (ADR-003). Typed fetchers only. The root module
  # replaces its api and client modules with ./api and ./client.
  prefetch: '{"type": "gomod", "path": "."}'

# Differences from upstream's image, on purpose:
#   - No /charts directory. Upstream copies its Helm chart into the image; the
#     binary does not read it.
#   - The build date is not compiled in, so the same source gives the same binary.
test:
  # Start-up test: the image must exit 0 when run with these arguments.
  command: ["--version"]

# Smoke test: an operator cannot be tested as one bare pod. It needs its CRDs,
# RBAC and configuration. smoke/deploy.sh renders upstream's own Helm chart
# from the pinned source with this image, adds the settings restricted pod
# security requires (the chart does not offer them), and applies it.
# functional/test.sh then creates an Etcd and expects the operator to create
# its StatefulSet.

redhat:
  # Partner Connect container component (fill after creating the component,
  # as Red Hat-hosted: ADR-002)
  componentId: "TODO-PARTNER-CONNECT-COMPONENT-ID"

# Pushed to ghcr.io/stakater/ubi/etcd-druid, private by default. To make it
# public, add 'staging: {visibility: public}' in a reviewed PR (ADR-002).
consumers:
  - TODO-CONFIRM-PRODUCT   # ⚠️ not stated when the image was requested; admission (d) needs the product that deploys it
