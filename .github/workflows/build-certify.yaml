# The factory pipeline, as a reusable workflow (ADR-006).
#
# Always: pinned source -> Hermeto prefetch -> offline build -> start-up test ->
# SBOMs + CVE gate -> preflight dry run.
#
# With publish=true, two more stages (ADR-002 rev 5):
#   1. Stage:   push to GHCR (ghcr.io/stakater/ubi/<name>), sign, attest.
#               Every image, with the workflow's own token.
#   2. Red Hat: copy the same digest to Red Hat's partner registry, sign,
#               attest, preflight --submit. Only for an image that has a Partner
#               Connect component ID and whose secrets exist.
#
# One job on purpose: the image that was tested is the image that is pushed.
# Every step is a script or make target, so `make image IMAGE=<name>` runs the
# build half on a laptop (ADR-007).
#
# No `permissions` block: the caller decides what a run may do. Pull-request
# callers grant read only. The publish caller adds packages, id-token and
# attestations.
name: build-certify

on:
  workflow_call:
    inputs:
      image-dir:
        description: Directory holding image.yaml and Containerfile, e.g. images/opencost
        required: true
        type: string
      publish:
        description: Stage to GHCR, and publish to Red Hat when the image is ready for it.
        required: false
        type: boolean
        default: false

# bash, named explicitly, runs with pipefail. The default shell does not, and
# then a failure on the left of a pipe is silently ignored.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ inputs.image-dir }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Two publishes of one image must not race for the same release number.
    concurrency:
      group: ${{ inputs.publish && 'publish' || github.ref }}-${{ inputs.image-dir }}
      cancel-in-progress: false
    env:
      IMAGE_DIR: ${{ inputs.image-dir }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        run: scripts/publish-plan.sh "$IMAGE_DIR" | tee -a "$GITHUB_OUTPUT"

      - name: Decide what this run publishes
        id: mode
        env:
          WANT_PUBLISH: ${{ inputs.publish }}
          PUBLISHABLE: ${{ steps.plan.outputs.publishable }}
          REASON: ${{ steps.plan.outputs.reason }}
          # Used only to see whether the secret exists. The value is never printed.
          RH_PYXIS: ${{ secrets.RH_PYXIS_TOKEN }}
        run: |
          stage=false
          redhat=false
          why=""
          if [ "$WANT_PUBLISH" = "true" ]; then
            stage=true
            if [ "$PUBLISHABLE" != "true" ]; then
              why="$REASON"
            else
              # The registry key is resolved later, at login. Here: is the
              # shared API key there at all?
              if [ -n "$RH_PYXIS" ]; then redhat=true; else why="the repository secret RH_PYXIS_TOKEN is missing (docs/setup.md, step 6)"; fi
            fi
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "redhat=$redhat" >> "$GITHUB_OUTPUT"
          if [ "$stage" = "true" ] && [ "$redhat" = "false" ]; then
            echo "::warning title=Not published to Red Hat::$IMAGE_DIR is staged to GHCR only: $why"
            {
              echo "### $IMAGE_DIR: staged to GHCR, **not published to Red Hat**"
              echo "$why"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to GHCR (staging)
        if: ${{ steps.mode.outputs.stage == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release number
        id: release
        env:
          STAGE: ${{ steps.mode.outputs.stage }}
          STAGING: ${{ steps.plan.outputs.staging_repository }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # The staging registry is the single source of release numbers.
          # Two commands, not a pipe: if the tags cannot be listed the step must
          # fail, not carry on as if there were none.
          release=0
          if [ "$STAGE" = "true" ]; then
            tags=$(scripts/list-tags.sh "$STAGING")
            release=$(printf '%s\n' "$tags" | scripts/next-release.sh "$VERSION")
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION-$release" >> "$GITHUB_OUTPUT"
          echo "Release: $release"

      - name: Build (pinned source, prefetch, network off)
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: make build IMAGE_DIR="$IMAGE_DIR" RELEASE="$RELEASE"

      - name: Test the image
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: make test-image IMAGE_DIR="$IMAGE_DIR" RELEASE="$RELEASE"

      # Runs the image as a pod under restricted pod security and asks it to
      # serve. An approximation of OpenShift, not OpenShift (story P.2b).
      - name: Smoke test on a local cluster
        run: make smoke IMAGE_DIR="$IMAGE_DIR"

      - name: SBOMs and CVE gate
        run: make scan IMAGE_DIR="$IMAGE_DIR"

      - name: Certification dry run (preflight)
        run: make preflight IMAGE_DIR="$IMAGE_DIR"

      - name: Publish rehearsal (local registry, no credentials)
        if: ${{ steps.mode.outputs.stage != 'true' }}
        run: make publish-rehearsal IMAGE_DIR="$IMAGE_DIR"

      # ------------------------------------------------- stage 1: GHCR
      # Outward-facing: pushes an image and writes a public signature-log entry.

      - name: Stage to GHCR
        id: stage
        if: ${{ steps.mode.outputs.stage == 'true' }}
        env:
          STAGING: ${{ steps.plan.outputs.staging_repository }}
          VISIBILITY: ${{ steps.plan.outputs.staging_visibility }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Never add to a package that is more open than the image declares
          # (ADR-002 rev 6).
          scripts/assert-visibility.sh "$STAGING" "$VISIBILITY"
          # A release tag is never overwritten (ADR-002 rule 3).
          scripts/assert-tag-free.sh "$STAGING" "$TAG"
          ref=$(scripts/push-image.sh "localhost/stakater/$(basename "$IMAGE_DIR"):build" "$STAGING" "$TAG")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      # A new package is created with the organisation's default visibility,
      # which a workflow cannot set. If that is more open than the image
      # declares, fail here, loudly, and do not sign, attest or promote.
      - name: Staged package is not more open than declared
        if: ${{ steps.mode.outputs.stage == 'true' }}
        env:
          STAGING: ${{ steps.plan.outputs.staging_repository }}
          VISIBILITY: ${{ steps.plan.outputs.staging_visibility }}
        run: scripts/assert-visibility.sh "$STAGING" "$VISIBILITY"

      - name: Install cosign
        if: ${{ steps.mode.outputs.stage == 'true' }}
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign and attest the staged image
        if: ${{ steps.mode.outputs.stage == 'true' }}
        env:
          REF: ${{ steps.stage.outputs.ref }}
        run: |
          evidence=".ctx/$(basename "$IMAGE_DIR")/evidence"
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "$evidence/sbom.image.spdx.json" "$REF"
          cosign attest --yes --type spdxjson --predicate "$evidence/sbom.deps.spdx.json" "$REF"

      - name: Attest build provenance (staged image)
        if: ${{ steps.mode.outputs.stage == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.plan.outputs.staging_repository }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          push-to-registry: true

      - name: Summary (staged)
        if: ${{ steps.mode.outputs.stage == 'true' }}
        env:
          REF: ${{ steps.stage.outputs.ref }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "### $IMAGE_DIR staged as \`$TAG\`"
            echo
            echo "Pushed, signed and attested: \`$REF\`"
            echo
            echo "For testing only. Customer-facing manifests reference Red Hat's registry."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------- stage 2: Red Hat
      # Outward-facing: publishes to Red Hat and submits for certification.

      # No secret is named per image (ADR-002 rev 7). The username comes from the
      # component ID; the key comes from the one shared RH_REGISTRY_KEYS secret.
      # If there is no key for this component yet, the stage is skipped, loudly.
      - name: Log in to Red Hat's partner registry
        id: rhlogin
        if: ${{ steps.mode.outputs.redhat == 'true' }}
        env:
          RH_REGISTRY_KEYS: ${{ secrets.RH_REGISTRY_KEYS }}
          COMPONENT_ID: ${{ steps.plan.outputs.component_id }}
        run: |
          rc=0
          scripts/rh-registry-login.sh "$COMPONENT_ID" "$(basename "$IMAGE_DIR")" || rc=$?
          if [ "$rc" = "0" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "3" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not published to Red Hat::$IMAGE_DIR is staged to GHCR only: no registry key for component $COMPONENT_ID in RH_REGISTRY_KEYS (docs/setup.md, step 6)"
            {
              echo "### $IMAGE_DIR: staged to GHCR, **not published to Red Hat**"
              echo "No registry key for component \`$COMPONENT_ID\` in the \`RH_REGISTRY_KEYS\` secret."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$rc"
          fi

      - name: Promote the staged digest to Red Hat
        id: redhat
        if: ${{ steps.rhlogin.outputs.ready == 'true' }}
        env:
          STAGED: ${{ steps.stage.outputs.ref }}
          REPOSITORY: ${{ steps.plan.outputs.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          scripts/assert-tag-free.sh "$REPOSITORY" "$TAG"
          # Copy by digest: what was staged and tested is what gets certified.
          ref=$(scripts/copy-image.sh "$STAGED" "$REPOSITORY" "$TAG")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Sign and attest the Red Hat image
        if: ${{ steps.rhlogin.outputs.ready == 'true' }}
        env:
          REF: ${{ steps.redhat.outputs.ref }}
        run: |
          evidence=".ctx/$(basename "$IMAGE_DIR")/evidence"
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "$evidence/sbom.image.spdx.json" "$REF"
          cosign attest --yes --type spdxjson --predicate "$evidence/sbom.deps.spdx.json" "$REF"

      - name: Attest build provenance (Red Hat image)
        if: ${{ steps.rhlogin.outputs.ready == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.plan.outputs.repository }}
          subject-digest: ${{ steps.redhat.outputs.digest }}
          push-to-registry: true

      - name: Submit to Red Hat for certification
        if: ${{ steps.rhlogin.outputs.ready == 'true' }}
        env:
          # One Partner Connect API key for every component (ADR-002 rule 5).
          PFLT_PYXIS_API_TOKEN: ${{ secrets.RH_PYXIS_TOKEN }}
          REPOSITORY: ${{ steps.plan.outputs.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          COMPONENT_ID: ${{ steps.plan.outputs.component_id }}
        run: scripts/preflight-submit.sh "$REPOSITORY:$TAG" "$COMPONENT_ID"

      - name: Summary (Red Hat)
        if: ${{ steps.rhlogin.outputs.ready == 'true' }}
        env:
          REF: ${{ steps.redhat.outputs.ref }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "### $IMAGE_DIR published to Red Hat as \`$TAG\`"
            echo
            echo "Copied by digest, signed, attested and submitted: \`$REF\`"
            echo
            echo "Consumers pin the digest, never the tag."
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------- evidence
      - name: Evidence file name
        id: evidence
        if: ${{ !cancelled() }}
        run: |
          # Files written by the tool containers belong to root; make them readable.
          sudo chown -R "$(id -u):$(id -g)" .ctx 2>/dev/null || true
          echo "name=evidence-$(basename "$IMAGE_DIR")" >> "$GITHUB_OUTPUT"

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: .ctx/*/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
