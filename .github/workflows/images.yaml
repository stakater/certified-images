# Builds and checks every image in images/ on pull requests, by calling the
# reusable factory pipeline (ADR-006: this repo is its first caller).
# No secrets, nothing published.
name: images

on:
  # Manual start: the re-scan workflow starts this on the fix branches it pushes.
  workflow_dispatch:
  pull_request:
    paths:
      - images/**
      - stacks/**
      - scripts/**
      - Makefile
      - tools.env
      - .github/workflows/images.yaml
      - .github/workflows/build-certify.yaml
      - tests/fixtures/network/**
      - tests/fixtures/smoke-*/**

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

# bash, named explicitly, runs with pipefail. The default shell does not, and
# then a failure on the left of a pipe is silently ignored.
defaults:
  run:
    shell: bash

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
      stacks: ${{ steps.list.outputs.stacks }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: List image directories
        id: list
        run: |
          # Only plain lowercase slugs: the name becomes a matrix value and a make argument.
          dirs=$(find images -mindepth 2 -maxdepth 2 -name image.yaml -exec dirname {} \; | sort |
            grep -E '^images/[a-z0-9]([a-z0-9-]*[a-z0-9])?$' | jq -R . | jq -cs .)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Images: $dirs"
          # Stacks: images that only work together (story E.1).
          stacks=$(find stacks -mindepth 2 -maxdepth 2 -name images -exec dirname {} \; 2>/dev/null | sort |
            { grep -E '^stacks/[a-z0-9]([a-z0-9-]*[a-z0-9])?$' || true; } | jq -R . | jq -cs .)
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "Stacks: $stacks"

  hermetic:
    name: builds cannot reach the network
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: make test-hermetic

  smoke-selftest:
    name: the smoke test can fail
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: make test-smoke

  image:
    needs: list
    if: ${{ needs.list.outputs.dirs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.list.outputs.dirs) }}
    uses: ./.github/workflows/build-certify.yaml
    with:
      image-dir: ${{ matrix.dir }}

  # Images that only work together, built from this checkout and run with each
  # other. The per-image jobs above run each one next to upstream's builds of
  # its peers, which cannot show that ours work together (story E.1).
  stack:
    name: stack (${{ matrix.dir }})
    needs: list
    if: ${{ needs.list.outputs.stacks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.list.outputs.stacks) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build the stack's images and run them together
        env:
          STACK_DIR: ${{ matrix.dir }}
        run: make stack STACK_DIR="$STACK_DIR"
