# The public catalogue site (story S.1, ADR-002 rev 12). OUTWARD-FACING on main:
# it deploys to GitHub Pages.
#
# The site is generated, never edited: scripts/site-data.sh reads this
# checkout, the registry, GitHub's attestations and Red Hat's catalogue, and
# static pages render the result. It lists only images declared public.
#
# Pull requests build it and keep the result as an artifact; nothing is
# deployed. On main it is rebuilt when an image, a stack or the site changes,
# after every publish run, every day after the re-scan, and by hand.
name: site

on:
  pull_request:
    paths:
      - site/**
      - scripts/site-data.sh
      - .github/workflows/site.yaml
  push:
    branches: [main]
    paths:
      - images/**
      - stacks/**
      - site/**
      - scripts/site-data.sh
      - .github/workflows/site.yaml
  workflow_run:
    workflows: [publish]
    types: [completed]
  schedule:
    - cron: "47 6 * * *" # 06:47 UTC every day, after the 05:17 re-scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

# bash, named explicitly, runs with pipefail. The default shell does not, and
# then a failure on the left of a pipe is silently ignored.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read # the daily re-scan's open findings
      attestations: read # whether each release's provenance verifies
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Generate the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: make site
      - name: Summary
        run: |
          {
            echo "### Catalogue site"
            echo
            echo "| Image | Latest release | Provenance | Red Hat |"
            echo "|---|---|---|---|"
            jq -r '.images[] | "| \(.name) | \(.releases[0].tag // "none") | \(.releases[0].provenance // "-") | \(.redhat.status) |"' _site/catalog.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the built site (pull requests)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site/
          if-no-files-found: error
      - name: Package for Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
